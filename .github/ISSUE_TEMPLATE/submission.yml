name: STEM Research Replication Inquiry
description: Propose a peer-reviewed STEM study or replication data for monthly curation
labels: ["editorial", "submission"]
body:
  - type: markdown
    attributes:
      value: Thank you for submitting research for OpenSTEM Replicate editorial curation.
  - type: input
    id: paper_title
    attributes:
      label: Publication Title
      description: Exact title of the peer-reviewed STEM publication
      placeholder: "e.g., Paper2Agent: Supercharging research workflows"
    validations:
      required: true
  - type: input
    id: doi
    attributes:
      label: DOI / Permanent Identifier
      placeholder: "e.g., 10.1038/s41586-026-09412-x"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary STEM Field
      options:
        - Science
        - Technology
        - Engineering
        - Mathematics
    validations:
      required: true
  - type: textarea
    id: abstract
    attributes:
      label: Brief Summary and Replication Context
      description: Why this paper matters and what data or code is available for replication
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I confirm this publication is published or under recognized preprint review with clear provenance.
          required: true
